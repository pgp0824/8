name: 构建乐8助手APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 读取仓库文件
        uses: actions/checkout@v4

      - name: 解压乐8助手源码
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q Happy8Assistant-source-with-cloud-build.zip -d extracted
          test -f extracted/Happy8Assistant/settings.gradle.kts

      - name: 设置JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 设置Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装Android 36组件
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: 设置Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: 测试并生成APK
        working-directory: extracted/Happy8Assistant
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug --stacktrace

      - name: 整理APK
        shell: bash
        run: |
          cp extracted/Happy8Assistant/app/build/outputs/apk/debug/app-debug.apk Happy8Assistant-debug.apk

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: Happy8Assistant-APK
          path: Happy8Assistant-debug.apk
          if-no-files-found: error
          retention-days: 30
